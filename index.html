<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QAID Monitor</title>
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #101827;
  color: white;
  text-align: center;
}
header {
  background: #17243a;
  padding: 25px;
  font-size: 25px;
  font-weight: bold;
}
.container {
  padding: 20px;
}
.card {
  background: #1d2b42;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}
button {
  background: #168b63;
  color: white;
  border: none;
  padding: 14px 25px;
  border-radius: 8px;
  font-size: 17px;
}
</style>
</head>
<body>
<header>QAID MONITOR</header>
<div class="container">
<h2>مرحباً بك في تطبيق قائد</h2>
<p>منصة إدارة الأجهزة والمشاركة الآمنة</p>
<div class="card">
<h3>إدارة الأجهزة</h3>
<p>إدارة الأجهزة المرتبطة بموافقة أصحابها.</p>
<button>إضافة جهاز</button>
</div>
<div class="card">
<h3>المشاركة الآمنة</h3>
<p>تحكم في البيانات التي توافق على مشاركتها.</p>
<button>إعدادات المشاركة</button>
</div>
</div>
</body>
</html>
